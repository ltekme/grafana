services:
  grafana:
    image: grafana/grafana-enterprise
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning:ro
    ports:
      - 3000:3000/tcp
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - ./kuma.password:/kuma.password:ro
      - prometheus-storage:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-remote-write-receiver"
    restart: unless-stopped
    depends_on:
      - nut-exporter
      - qittorren-exporter

  loki:
    image: grafana/loki
    volumes:
      - loki-storage:/loki
      - ./loki.yaml:/etc/loki/config.yaml:ro
    restart: unless-stopped

  alloy:
    image: grafana/alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - 514:514/tcp
      - 514:514/udp
      - 4318:4318/tcp
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

  rsyslog: # For Legacy Cisco Devices That likes to do whatever they want
    image: rsyslog/rsyslog
    volumes:
      - ./rsyslog.conf:/etc/rsyslog.d/rsyslog.conf:ro
    ports:
      - 1514:514/udp
      - 1514:514/tcp
    restart: unless-stopped
    depends_on:
      - alloy

  nut-exporter:
    image: druggeri/nut_exporter
    restart: unless-stopped

  qittorren-exporter:
    image: ghcr.io/esanchezm/prometheus-qbittorrent-exporter
    environment:
      - QBITTORRENT_PORT=8080
      - QBITTORRENT_HOST=iso.internal.ltek.me
      - QBITTORRENT_SSL=False
    restart: unless-stopped

volumes:
  grafana-storage:
  prometheus-storage:
  loki-storage:
